<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProPath Futebol — A Carreira</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- LANDING (página inicial pública) -->
  <div id="landing" class="hidden"></div>

  <!-- AUTH / LOGIN -->
  <div id="auth" class="hidden"></div>

  <!-- ONBOARDING -->
  <div id="onboard" class="hidden"></div>

  <!-- APP -->
  <header id="topbar" class="hidden">
    <div class="brand">PRO<span>PATH</span> · FUTEBOL</div>
    <div id="topbar-info" class="topinfo"></div>
    <div class="topbtns">
      <span id="top-user" class="top-user"></span>
      <button class="tbtn" id="btn-save">Salvar</button>
      <button class="tbtn ghost" id="btn-menu">☰</button>
      <button class="tbtn ghost hidden" id="btn-logout" title="Sair da conta">⏻</button>
    </div>
  </header>

  <nav id="tabs" class="hidden"></nav>

  <main id="app" class="hidden"></main>

  <!-- MODAL / TOAST -->
  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script src="data.js"></script>
  <script src="archetypes.js"></script>
  <script src="engine.js"></script>
  <script src="ui.js"></script>
  <script src="comps.js"></script>
  <script src="home.js"></script>
  <script src="main.js"></script>
  <script src="livematch.js"></script>
</body>
</html>
