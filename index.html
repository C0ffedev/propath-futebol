<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProPath Futebol — A Carreira</title>
<link rel="stylesheet" href="styles.css?v=16">
</head>
<body>
  <!-- LANDING (página inicial pública) -->
  <div id="landing" class="hidden"></div>

  <!-- AUTH / LOGIN -->
  <div id="auth" class="hidden"></div>

  <!-- ONBOARDING -->
  <div id="onboard" class="hidden"></div>

  <!-- APP -->
  <header id="topbar" class="hidden">
    <div class="brand">PRO<span>PATH</span> · FUTEBOL</div>
    <div id="topbar-info" class="topinfo"></div>
    <div class="topbtns">
      <span id="top-user" class="top-user"></span>
      <button class="tbtn" id="btn-save">Salvar</button>
      <button class="tbtn gold hidden" id="btn-god" title="God Mode (só dono)">👑 God</button>
      <button class="tbtn ghost" id="btn-menu">☰</button>
      <button class="tbtn ghost hidden" id="btn-logout" title="Sair da conta">⏻</button>
    </div>
  </header>

  <nav id="tabs" class="hidden"></nav>

  <main id="app" class="hidden"></main>

  <!-- MODAL / TOAST -->
  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script src="data.js?v=16"></script>
  <script src="archetypes.js?v=16"></script>
  <script src="engine.js?v=16"></script>
  <script src="ui.js?v=16"></script>
  <script src="comps.js?v=16"></script>
  <script src="home.js?v=16"></script>
  <script src="main.js?v=16"></script>
  <script src="livematch.js?v=16"></script>
  <script>
  // Defesa extra: garante handlers do topbar mesmo se o main.js falhar ao carregar.
  // (O bindTopbar do main.js é a fonte principal; isto é apenas um safety net idempotente.)
  (function(){
    function safeBind(id, fn){
      var el = document.getElementById(id);
      if (el && !el.dataset.bound){ try { el.onclick = fn; el.dataset.bound = '1'; } catch(e){} }
    }
    function tryBind(){
      var menu = document.getElementById('btn-menu');
      if (menu && !menu.dataset.bound){
        safeBind('btn-menu', function(){ if (window.UI && window.UI.S){ if (window.UI.hub) window.UI.hub(); } else if (typeof loadList === 'function'){ loadList(); } });
        safeBind('btn-save', function(){ if (typeof saveGame === 'function') saveGame(); });
        safeBind('btn-logout', function(){ if (typeof logout === 'function') logout(); });
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tryBind);
    else tryBind();
    // tenta de novo após o main.js carregar (caso a ordem atrase)
    window.addEventListener('load', tryBind);
  })();
  </script>
</body>
</html>
