app = "propath-futebol"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4321"

[http_service]
  internal_port = 4321
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
