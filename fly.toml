app = "propath-futebol"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4321"
  # banco SQLite persiste no volume montado em /data (sobrevive a redeploys frios)
  DB_PATH = "/data/carreira.db"

[http_service]
  internal_port = 4321
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "propath_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
